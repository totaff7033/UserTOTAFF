name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Basic Android Project Structure
        run: |
          mkdir -p my-app/app/src/main/assets/public
          cp index.html my-app/app/src/main/assets/public/index.html
          
          # Basic build.gradle create karna taaki gradle build chal sake
          echo "apply plugin: 'com.android.application'" > my-app/app/build.gradle
          echo "android { compileSdk 33; defaultConfig { applicationId 'com.totaff.app'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }" >> my-app/app/build.gradle
          
          echo "include ':app'" > my-app/settings.gradle
          echo "rootProject.name='TotaFF'" >> my-app/build.gradle

      - name: Build APK (Direct Gradle)
        run: |
          # Agar capacitor setup complex lag raha hai, toh hum isse bhi asan Webview action use kar sakte hain
          echo "Building workflow..."
          
